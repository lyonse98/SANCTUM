name: Deploy Sanctum functions

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Link project
        run: supabase link --project-ref hfjtqwlwaxgnpvwjdfdq

      - name: Deploy functions
        run: |
          set -e
          for fn in chat-proxy daily-reflection daily-readings push-dispatch audio-render corpus-retrieve corpus-ingest analytics-track tailor-devotional; do
            echo "=== deploying $fn ==="
            supabase functions deploy "$fn" --no-verify-jwt --yes
          done
          echo "=== deploying feedback-submit ==="
          supabase functions deploy feedback-submit --yes
